version: __APP_VERSION__
name: SpecTrainer
description: Speculative-decoding on-policy response regeneration (resampling) orchestrator; skill scripts are orchestration wrappers over the open-source speculators repo (v0.6.0) - DFX precheck -> input normalization -> verifier-based response regeneration into pre-tokenized samples (input_ids/loss_mask)
prompt:
  - prompts/agents/SpecTrainer.md
  - prompts/suffixes/environments.md
llm: default
checkpointer: sqlite
default: false
subagents:
  - explorer
recursion_limit: 1000
tools:
  patterns:
    - impl:deepagents:*
  use_catalog: false
  output_max_tokens: 10000
skills:
  patterns:
    - speculators:*
  use_catalog: false
compression:
  auto_compress_enabled: true
  auto_compress_threshold: 0.8
  llm: default
  prompt:
    - prompts/shared/general_compression.md
    - prompts/suffixes/environments.md
retry:
  enabled: true
  model:
    enabled: true
    max_retries: 5
    timeout: 120.0
  tool:
    enabled: true
    max_retries: 5
    tools: null
    retry_on: null
    on_failure: continue
    backoff_factor: 2.0
    initial_delay: 5.0
    max_delay: 60.0
    jitter: true
audit_log:
  enabled: true
